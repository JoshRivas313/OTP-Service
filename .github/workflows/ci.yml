name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Sin Docker ni cuentas externas: los proveedores de SMS y correo se simulan y el almacenamiento es en memoria.
      - name: Pruebas
        run: bash ./mvnw -B -ntp verify
