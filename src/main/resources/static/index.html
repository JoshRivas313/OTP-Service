<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Service</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --success: #22c55e;
    --error: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  header {
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 12px;
    flex-shrink: 0;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .result {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .result.show { display: block; }
  .result.ok {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid var(--success);
    color: var(--success);
  }
  .result.err {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>OTP Service</h1>
      <p>Autenticación por código de un solo uso</p>
    </header>

    <div class="card">
      <h2><span class="step">1</span> Generar código</h2>
      <label for="gen-cellphone">Celular</label>
      <input id="gen-cellphone" type="text" placeholder="987654321" maxlength="9">
      <button id="gen-btn" onclick="generateOtp()">Enviar código</button>
      <div id="gen-result" class="result"></div>
      <p class="hint">En modo consola, el código aparece en la terminal del servidor, no aquí.</p>
    </div>

    <div class="card">
      <h2><span class="step">2</span> Verificar código</h2>
      <label for="ver-cellphone">Celular</label>
      <input id="ver-cellphone" type="text" placeholder="987654321" maxlength="9">
      <label for="ver-code">Código</label>
      <input id="ver-code" type="text" placeholder="000000" maxlength="10">
      <button id="ver-btn" onclick="verifyOtp()">Verificar</button>
      <div id="ver-result" class="result"></div>
    </div>
  </div>

<script>
  async function generateOtp() {
    const cellphone = document.getElementById('gen-cellphone').value.trim();
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;
    try {
      const response = await fetch('/otps', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cellphone })
      });
      const data = await response.json();
      showResult('gen-result', response.ok, data.message || data.code);
    } catch (error) {
      showResult('gen-result', false, 'No se pudo conectar con el servidor');
    } finally {
      btn.disabled = false;
    }
  }

  async function verifyOtp() {
    const cellphone = document.getElementById('ver-cellphone').value.trim();
    const code = document.getElementById('ver-code').value.trim();
    const btn = document.getElementById('ver-btn');
    btn.disabled = true;
    try {
      const response = await fetch('/otps/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cellphone, code })
      });
      const data = await response.json();
      showResult('ver-result', response.ok, data.message || data.code);
    } catch (error) {
      showResult('ver-result', false, 'No se pudo conectar con el servidor');
    } finally {
      btn.disabled = false;
    }
  }

  function showResult(elementId, ok, message) {
    const el = document.getElementById(elementId);
    el.textContent = message;
    el.className = 'result show ' + (ok ? 'ok' : 'err');
  }
</script>
</body>
</html>
