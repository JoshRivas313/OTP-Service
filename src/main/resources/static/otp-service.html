<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Service</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2314210d'/%3E%3Cpath d='M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z' fill='none' stroke='%236db33f' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="#6db33f" stroke-width="1.5"/>
          <path d="M9 12l2 2 4-4" stroke="#6db33f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>OTP Service</h1>
      <p>Autenticación por código de un solo uso</p>
    </header>

    <div class="cards-row">
      <div class="card">
        <div class="card-head">
          <span class="step">1</span>
          <h2>Generar código</h2>
        </div>
        <div class="field">
          <label for="gen-cellphone">Celular</label>
          <div class="field-wrap">
            <span class="prefix">+51</span>
            <input id="gen-cellphone" class="with-prefix" type="tel" inputmode="numeric" placeholder="987654321" maxlength="9">
          </div>
        </div>
        <button id="gen-btn" onclick="generateOtp()">
          <span class="spinner"></span>
          <span class="btn-label">Enviar código</span>
        </button>
        <div id="gen-result" class="result" role="status" aria-live="polite"></div>
        <p class="hint">El código llega por SMS real a través de tu cuenta de Twilio conectada.</p>
      </div>

      <div class="card">
        <div class="card-head">
          <span class="step">2</span>
          <h2>Verificar código</h2>
        </div>
        <div class="field">
          <label for="ver-cellphone">Celular</label>
          <div class="field-wrap">
            <span class="prefix">+51</span>
            <input id="ver-cellphone" class="with-prefix" type="tel" inputmode="numeric" placeholder="987654321" maxlength="9">
          </div>
        </div>
        <div class="field">
          <label for="ver-code">Código</label>
          <input id="ver-code" class="code-input" type="text" inputmode="numeric" placeholder="000000" maxlength="10">
        </div>
        <button id="ver-btn" onclick="verifyOtp()">
          <span class="spinner"></span>
          <span class="btn-label">Verificar</span>
        </button>
        <div id="ver-result" class="result" role="status" aria-live="polite"></div>
      </div>
    </div>

    <div id="twilio-status-bar" style="display:none; text-align:center; font-size:13px;">
      <span id="twilio-connected-badge" style="display:none;">
        <span class="tw-dot"></span>Twilio conectado <span id="tw-masked-inline"></span>
        · <a href="#" onclick="changeTwilioConfig(); return false;" class="twilio-link">Cambiar configuración</a>
      </span>
      <a id="twilio-connect-link" href="/" class="twilio-link" style="display:none;">Conectá tu cuenta de Twilio para continuar →</a>
    </div>

    <footer>Spring Boot · MongoDB · HMAC-SHA256</footer>
  </div>

<script>
  const ICON_OK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const ICON_ERR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  document.querySelectorAll('input[inputmode="numeric"]').forEach(input => {
    input.addEventListener('input', () => {
      input.value = input.value.replace(/\D/g, '');
    });
  });

  async function generateOtp() {
    const cellphone = document.getElementById('gen-cellphone').value.trim();
    await submit('gen-btn', 'gen-result', '/api/twilio/otps', { cellphone });
  }

  async function verifyOtp() {
    const cellphone = document.getElementById('ver-cellphone').value.trim();
    const code = document.getElementById('ver-code').value.trim();
    await submit('ver-btn', 'ver-result', '/api/twilio/otps/verify', { cellphone, code });
  }

  async function submit(buttonId, resultId, url, body) {
    const btn = document.getElementById(buttonId);
    btn.disabled = true;
    btn.classList.add('loading');
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await response.json();
      showResult(resultId, response.ok, data.message || data.code);
    } catch (error) {
      showResult(resultId, false, 'No se pudo conectar con el servidor');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showResult(elementId, ok, message) {
    const el = document.getElementById(elementId);
    el.innerHTML = (ok ? ICON_OK : ICON_ERR) + '<span>' + message + '</span>';
    el.className = 'result show ' + (ok ? 'ok' : 'err');
  }

  async function checkTwilioBanner() {
    try {
      document.getElementById('twilio-status-bar').style.display = 'block';
      const statusResponse = await fetch('/api/twilio/status');
      const status = await statusResponse.json();
      document.getElementById('twilio-connected-badge').style.display = status.connected ? 'inline' : 'none';
      document.getElementById('twilio-connect-link').style.display = status.connected ? 'none' : 'inline';
      if (status.connected) {
        document.getElementById('tw-masked-inline').textContent = status.maskedCredentials;
      }
    } catch (error) {
      // si /api/twilio/status falla, la barra se queda oculta y el resto de la pagina sigue andando
    }
  }

  async function changeTwilioConfig() {
    await fetch('/api/twilio/disconnect', { method: 'POST' });
    window.location.href = '/';
  }

  checkTwilioBanner();
</script>
</body>
</html>
