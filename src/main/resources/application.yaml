server:
  port: ${PORT:8080}
  servlet:
    session:
      # Sesiones solo para quien conecto Twilio; una sesion abandonada no debe quedar 30 minutos en memoria.
      timeout: 15m
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
  # IP del cliente: Tomcat (RemoteIpValve) lee X-Forwarded-For solo si la conexion viene de un proxy de confianza
  # (server.tomcat.remoteip.internal-proxies; por defecto, redes privadas y localhost) y toma el primer valor
  # empezando por la derecha que no sea un proxy. Lo que el cliente escriba a la izquierda se ignora.
  forward-headers-strategy: native
  # Al apagarse (Render lo hace al redesplegar o dormir) termina las peticiones en curso antes de cerrar.
  shutdown: graceful

spring:
  application:
    name: otp-service
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

otp:
  digits: 6
  duration-seconds: 30
  max-attempts: 3
  retention-seconds: 86400
  # Una credencial HOTP/TOTP sin actividad se borra sola pasado este tiempo (30 dias). Es el TTL del indice en Mongo.
  credential-retention-seconds: ${OTP_CREDENTIAL_RETENTION_SECONDS:2592000}
  # Sin valor por defecto: RequiredSecretsGuard exige uno propio. Para desarrollo, perfil dev (application-dev.yaml).
  hash-secret: ${OTP_HASH_SECRET:}
  demo-mode: ${OTP_DEMO_MODE:false}
  local-api-enabled: ${OTP_LOCAL_API_ENABLED:true}
  memory-max-entries: ${OTP_MEMORY_MAX_ENTRIES:10000}
  rate-limit-per-destination: ${OTP_RATE_LIMIT_PER_DESTINATION:5}
  rate-limit-per-ip: ${OTP_RATE_LIMIT_PER_IP:20}
  rate-limit-window-seconds: ${OTP_RATE_LIMIT_WINDOW_SECONDS:600}
  verify-rate-limit-per-destination: ${OTP_VERIFY_RATE_LIMIT_PER_DESTINATION:10}
  verify-rate-limit-per-ip: ${OTP_VERIFY_RATE_LIMIT_PER_IP:30}
  # Conexiones de Twilio por IP en la misma ventana: cada una llama a Twilio con credenciales del visitante.
  connect-rate-limit-per-ip: ${OTP_CONNECT_RATE_LIMIT_PER_IP:10}
  # Tope global de envios por dia, para no agotar la cuota del proveedor (Brevo gratis: 300 al dia). 0 lo desactiva.
  daily-send-limit: ${OTP_DAILY_SEND_LIMIT:0}
  # Duracion de un bloqueo por intentos fallidos (HOTP y TOTP). No es la retencion de datos.
  lock-seconds: ${OTP_LOCK_SECONDS:600}
  # Escribir el codigo en el log con los proveedores de consola. Apagado por defecto; el perfil dev lo enciende.
  log-codes: ${OTP_LOG_CODES:false}
  # Dejar que quien pide el codigo escriba el texto del mensaje. Apagado por defecto: el texto lo decide el servidor.
  custom-message-enabled: ${OTP_CUSTOM_MESSAGE_ENABLED:false}

hmac:
  # AES-256 en Base64 (openssl rand -base64 32). Si se pierde, los secretos guardados de HOTP y TOTP dejan de servir.
  # Sin valor por defecto: RequiredSecretsGuard exige uno propio. Para desarrollo, perfil dev.
  encryption-key: ${OTP_SECRET_ENCRYPTION_KEY:}
  totp-tolerance-steps: 1
  hotp-look-ahead: 10

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

email:
  provider: ${EMAIL_PROVIDER:console}
  sender-address: ${EMAIL_SENDER_ADDRESS:}
  sender-name: ${EMAIL_SENDER_NAME:Un Solo Uso}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com}

sms:
  provider: ${SMS_PROVIDER:console}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
  infobip:
    base-url: ${INFOBIP_BASE_URL:}
    api-key: ${INFOBIP_API_KEY:}
    sender: ${INFOBIP_SENDER:}

---
spring:
  config:
    activate:
      on-profile: "!mongo"
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/otp_service}
  data:
    mongodb:
      auto-index-creation: true
