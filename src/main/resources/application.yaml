server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: lax
  forward-headers-strategy: framework

spring:
  application:
    name: otp-service
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

otp:
  digits: 6
  duration-seconds: 30
  max-attempts: 3
  retention-seconds: 86400
  hash-secret: ${OTP_HASH_SECRET:dev-only-secret-change-me}
  demo-mode: ${OTP_DEMO_MODE:false}
  local-api-enabled: ${OTP_LOCAL_API_ENABLED:true}
  memory-max-entries: ${OTP_MEMORY_MAX_ENTRIES:10000}
  rate-limit-per-destination: ${OTP_RATE_LIMIT_PER_DESTINATION:5}
  rate-limit-per-ip: ${OTP_RATE_LIMIT_PER_IP:20}
  rate-limit-window-seconds: ${OTP_RATE_LIMIT_WINDOW_SECONDS:600}

hmac:
  # AES-256 en Base64 (openssl rand -base64 32). Si se pierde, los secretos guardados de HOTP y TOTP dejan de servir.
  encryption-key: ${OTP_SECRET_ENCRYPTION_KEY:ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktY2hhbmdlbWU=}
  totp-tolerance-steps: 1
  hotp-look-ahead: 10

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

email:
  provider: ${EMAIL_PROVIDER:console}
  sender-address: ${EMAIL_SENDER_ADDRESS:}
  sender-name: ${EMAIL_SENDER_NAME:Un Solo Uso}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: ${BREVO_BASE_URL:https://api.brevo.com}

sms:
  provider: ${SMS_PROVIDER:console}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
  infobip:
    base-url: ${INFOBIP_BASE_URL:}
    api-key: ${INFOBIP_API_KEY:}
    sender: ${INFOBIP_SENDER:}

---
spring:
  config:
    activate:
      on-profile: "!mongo"
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration

---
spring:
  config:
    activate:
      on-profile: mongo
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/otp_service}
  data:
    mongodb:
      auto-index-creation: true
